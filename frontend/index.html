<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kindred</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/kindred-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/android-chrome-512x512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/assets/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/assets/icons/apple-touch-icon-120.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#67863a" />
    <!-- Self-hosted display font (see @font-face in index.css). Preload the
         common 700 weight so headings render in the real font early; the
         metric-matched fallback keeps CLS ~0 if it arrives after first paint. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/cabinet-grotesk-700.woff2"
      crossorigin
    />
    <!-- Apply the persisted theme before first paint to avoid a light->dark flash.
         Mirrors ThemeProvider (storageKey "vite-ui-theme", defaultTheme "dark"). -->
    <script>
      (() => {
        try {
          let t = localStorage.getItem("vite-ui-theme") || "dark"
          if (t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
          }
          document.documentElement.classList.add(t)
        } catch (_e) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
    <style>
      /* Instant, theme-aware paint while the app bundle loads. React replaces
         #root's contents on mount, removing this automatically. Colors come from
         the render-blocking app CSS (--background/--primary), with safe fallbacks. */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background, #fdfcfa);
      }
      #app-loader .spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid color-mix(in oklch, var(--foreground, #1a1a1a) 14%, transparent);
        border-top-color: var(--primary, #67863a);
        animation: app-loader-spin 0.7s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .spinner {
          animation-duration: 2s;
        }
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader" aria-hidden="true">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
