name: Semantic diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sem-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  entity-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Ataraxy-Labs/sem/action@v0.29.0
        with:
          sem-version: v0.29.0
