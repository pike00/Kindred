name: Release

# Triggered by `vX.Y.Z` (and pre-release `vX.Y.Z-rc.N`) tag pushes.
# Builds the combined image from Dockerfile.prod and pushes to GHCR.
# Deploy is manual: `just bump <tag>` on ares.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure Docker credential store
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo '{"auths":{}}' > "$RUNNER_TEMP/docker-config/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          # Always tag with the version + immutable sha; a "latest" floats
          # to whichever production-deployable tag last shipped (skips -rc).
          tags: |
            ghcr.io/pike00/kindred:${{ github.ref_name }}
            ghcr.io/pike00/kindred:sha-${{ github.sha }}
          cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache,mode=max
