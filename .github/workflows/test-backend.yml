name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Create .env from example
        run: cp .env.example .env
      - name: Pre-create external networks and volumes
        run: |
          docker network create kindred-private || true
          docker network create kindred-internal-crm || true
          docker volume create crm-db || true
          docker volume create crm-redis || true
          docker volume create crm-meili || true
      - run: docker compose -f compose.yml -f compose.ci.yml down -v --remove-orphans
      - run: docker compose -f compose.yml -f compose.ci.yml up -d db
      - name: Migrate DB
        env:
          POSTGRES_SERVER: localhost
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        env:
          SHA: ${{ github.sha }}
          POSTGRES_SERVER: localhost
        run: uv run bash scripts/tests-start.sh "Coverage for $SHA"
        working-directory: backend
      - run: docker compose -f compose.yml -f compose.ci.yml down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        # Threshold tracks current coverage. Raise as coverage improves.
        # Gaps today: worker.py, search.py, vcard.py, carddav/storage.py,
        # and most feature routes outside users/contacts/login.
        run: uv run coverage report --fail-under=60
        working-directory: backend
