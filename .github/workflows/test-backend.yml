name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Create .env from example
        run: cp .env.example .env
      - name: Migrate DB
        env:
          POSTGRES_SERVER: localhost
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        env:
          SHA: ${{ github.sha }}
          POSTGRES_SERVER: localhost
        run: uv run bash scripts/tests-start.sh "Coverage for $SHA"
        working-directory: backend
      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        # Threshold tracks current coverage. Raise as coverage improves.
        # Gaps today: worker.py, search.py, vcard.py, carddav/storage.py,
        # and most feature routes outside users/contacts/login.
        run: uv run coverage report --fail-under=60
        working-directory: backend
