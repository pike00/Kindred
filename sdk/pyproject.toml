[project]
name = "kindred"
version = "0.1.0"
description = "Python client + CLI for the Kindred personal CRM API"
readme = "README.md"
authors = [
    { name = "Will Pike", email = "pike00@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=23.2",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "python-dateutil>=2.9",
    "typer>=0.12",
]

[project.scripts]
kindred = "kindred.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kindred"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Generated code: don't enforce style; regen.sh overwrites it.
"src/kindred/_generated/**" = ["ALL"]

[dependency-groups]
dev = [
    "openapi-python-client>=0.28",
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]
