services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    networks:
      - kindred-private
      - kindred-internal-crm
    dns:
      - 172.20.2.253
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm-api.rule=Host(`kindred.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/dav`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.crm-api.entrypoints=websecure"
      - "traefik.http.routers.crm-api.tls=true"
      - "traefik.http.services.crm-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=kindred-private"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/utils/health-check/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: https://kindred.${DOMAIN}
        VITE_AUTH_MODE: ${AUTH_MODE:-local}
        VITE_CF_LOGOUT_URL: ${VITE_CF_LOGOUT_URL:-}
    networks:
      - kindred-private
    dns:
      - 172.20.2.253
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm.rule=Host(`kindred.${DOMAIN}`)"
      - "traefik.http.routers.crm.entrypoints=websecure"
      - "traefik.http.routers.crm.tls=true"
      - "traefik.http.services.crm.loadbalancer.server.port=80"
      - "traefik.docker.network=kindred-private"

  db:
    image: postgres:18-alpine
    container_name: crm-db
    env_file: .env
    volumes:
      - crm-db:/var/lib/postgresql/data
    networks:
      - kindred-internal-crm
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    networks:
      - kindred-internal-crm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - crm-redis:/data
    networks:
      - kindred-internal-crm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    env_file: .env
    volumes:
      - crm-meili:/meili_data
    networks:
      - kindred-internal-crm
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5


  whisper:
    build:
      context: ./whisper-service
    env_file: .env
    networks:
      - kindred-internal-crm
    dns:
      - 172.20.2.253
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  crm-db:
    external: true
  crm-redis:
    external: true
  crm-meili:
    external: true

networks:
  kindred-private:
    external: true
  kindred-internal-crm:
    name: kindred-internal-crm
    external: true
