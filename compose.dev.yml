services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    networks:
      - kindred-private
      - kindred-internal-crm
    dns:
      - 172.20.2.253
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/scripts:/app/backend/scripts
      - ./backend/tests:/app/backend/tests
      - ./backend/alembic.ini:/app/backend/alembic.ini:ro
    working_dir: /app/backend
    command: ["bash", "-c", "bash scripts/prestart.sh && fastapi run --reload app/main.py"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm-api.rule=Host(`kindred.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`) || PathPrefix(`/dav`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.crm-api.entrypoints=websecure"
      - "traefik.http.routers.crm-api.tls=true"
      - "traefik.http.services.crm-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=kindred-private"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: oven/bun:1
    working_dir: /app/frontend
    env_file: .env
    environment:
      - VITE_API_URL=https://kindred.${DOMAIN}
      - VITE_PUBLIC_HOST=kindred.${DOMAIN}
      - VITE_AUTH_MODE=${AUTH_MODE:-local}
      - VITE_CF_LOGOUT_URL=${VITE_CF_LOGOUT_URL:-}
    volumes:
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock:ro
      - ./frontend:/app/frontend
      - crm-frontend-node-modules:/app/frontend/node_modules
    command:
      - sh
      - -c
      - |
        bun install --frozen-lockfile &&
        bun run dev --host 0.0.0.0 --port 5173
    networks:
      - kindred-private
    dns:
      - 172.20.2.253
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm.rule=Host(`kindred.${DOMAIN}`)"
      - "traefik.http.routers.crm.entrypoints=websecure"
      - "traefik.http.routers.crm.tls=true"
      - "traefik.http.services.crm.loadbalancer.server.port=5173"
      - "traefik.docker.network=kindred-private"

  db:
    image: postgres:18-alpine
    container_name: crm-db
    restart: unless-stopped
    env_file: .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - crm-db:/var/lib/postgresql/data
    networks:
      - kindred-internal-crm
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    volumes:
      - ./backend/app:/app/backend/app
    working_dir: /app/backend
    networks:
      - kindred-internal-crm
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - crm-redis:/data
    networks:
      - kindred-internal-crm
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    env_file: .env
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - crm-meili:/meili_data
    networks:
      - kindred-internal-crm
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crm-db:
    external: true
  crm-redis:
    external: true
  crm-meili:
    external: true
  crm-frontend-node-modules:

networks:
  kindred-private:
    external: true
  kindred-internal-crm:
    external: true
