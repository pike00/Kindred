packages:
  - frontend

overrides:
  rollup: 4.61.1
  # openapi-ts pins an older parser; its js-yaml dependency is API-compatible 4.x.
  '@hey-api/json-schema-ref-parser>js-yaml': 4.3.2

# pnpm v11 reads these from pnpm-workspace.yaml (not .npmrc).
# Flat/hoisted node_modules (like npm/bun) so vitest/config + vite plugins
# resolve without pnpm's strict symlink isolation.
nodeLinker: hoisted

# @vitejs/plugin-react-swc -> @swc/core needs its postinstall to link the
# native binding. pnpm v11 blocks build scripts until explicitly allowed.
allowBuilds:
  '@swc/core': true
