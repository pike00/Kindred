[project]
name = "app"
version = "0.2.123"
description = ""
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]>=0.165.0,<1.0.0",
    "python-multipart>=0.0.34,<1.0.0",
    "email-validator>=2.4.0,<3.0.0.0",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>=2.14.4",
    "emails>=1.1.3,<2.0.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.20.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.9,<4.0.0",
    "sqlmodel>=0.0.50,<1.0.0",
    "sqlalchemy<=2.1.9,>=2.1.9",
    "pydantic-settings>=2.16.3,<3.0.0",
    "sentry-sdk[fastapi]>=2.69.1,<3.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.4.2",
    "vobject>=0.9.9",
    "icalendar>=7.3.2",
    "rapidfuzz>=3.14.6",
    "radicale>=3.9.2",
    "arq>=0.26",
    "apprise>=1.13.1",
    "meilisearch>=0.43.0",
    "phonenumbers>=9.0.44",
    "google-auth>=2.63.1",
    "google-auth-oauthlib>=1.5.0",
]

[dependency-groups]
build = ["hatchling==1.32.4", "setuptools==84.2.1", "wheel==0.48.0"]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "mypy>=2.3.1,<3.0.0",
    "ruff>=0.17.6,<1.0.0",
    "prek>=0.5.11,<1.0.0",
    "coverage>=7.17.5,<8.0.0",
    "cryptography>=50.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
