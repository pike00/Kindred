[release-kit]
project_name = "kindred"
project_description = "Self-hosted personal CRM — contacts, interactions, reminders, gifts, debts, journal entries — with CardDAV sync, full-text search, and a React frontend."
model = "deepseek-v4-pro-cloud"
base_url = "https://litellm.lab.khanpikehome.com/v1"
reasoning_effort = "low"
changelog_path = "CHANGELOG.md"
branch = "main"
# Image brand is "kindred" but the repo is "personal-crm". GH release notes
# audience is the operator who runs the container, not an end user, so the
# install command is omitted.

# `just version` resolves prod from the homelab compose .env.
# Same target as kindred/ — both repos build the kindred image.
prod_source = "homelab"
prod_homelab_env = "apps/kindred/.env"
