[preview-kit]
project_name = "kindred"
project_prefix = "crm"
host_pattern = "{slug}.kindred.{domain}"
compose_file = "compose.worktree.yml"
health_path = "/api/v1/utils/health-check/"
base = "main"
shell_service = "backend"
test_service = "backend"
test_command = "pytest"

[preview-kit.ports]
BACKEND_PORT = 8000
FRONTEND_PORT = 5173
DB_PORT = 15432
REDIS_PORT = 16379
MEILI_PORT = 17700
